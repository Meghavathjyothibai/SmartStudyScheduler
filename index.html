<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css"/>
  <title>Smart Study Scheduler</title>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h2>Login</h2>
      <input type="password" id="login-password" placeholder="Enter Secret Password" />
      <button id="login-btn">Login</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <div id="app" style="display: none;">
    <header>
      <h1>Smart Study Scheduler</h1>
    </header>
    <main>
      <div class="study-form">
        <input type="text" id="subject" placeholder="Enter subject..." />
        <select id="priority">
          <option value="top">Top Priority</option>
          <option value="middle">Middle Priority</option>
          <option value="low">Less Priority</option>
        </select>
        <input type="number" id="hours" placeholder="Hours to study" min="1" />
        <input type="date" id="deadline" />
        <button id="add-subject">Add Subject</button>
      </div>

      <div class="subject-list" id="subject-list"></div>
      <div class="button-group">
        <button id="generate-schedule" class="btn-blue">Generate Schedule</button>
        <button id="clear-completed" class="btn-yellow">Clear Completed Subjects</button>
        <button id="clear-all" class="btn-red">Clear All Subjects</button>
      </div>

      <div id="generated-schedule"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
